name: Build & Release APK

# عند كل دفع إلى main: يبني APK موقّعًا وينشره إلى إصدار ثابت "latest"
# (رابط تنزيل دائم + version.json يقرأه التطبيق للتحديث الذاتيّ).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # الأسرار كمتغيّرات بيئة على مستوى الوظيفة — لأنّ سياق secrets غير مسموح
    # داخل شرط if: (كان يسبّب فشل إقلاع سير العمل بالكامل).
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      # مفتاح التوقيع من أسرار المستودع (إن وُجدت) — كي تُثبَّت التحديثات فوق
      # القديم بلا فقدان بيانات. بدونها يُبنى بتوقيع debug (للتجربة فقط).
      - name: Prepare signing
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          # نتسامح مع المسافات والأسطر الزائدة عند لصق قيمة السرّ (تجاهل الفراغات).
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d \
            > android/app/health-release.jks 2>/dev/null || true
          # إن كان المفتاح صالحًا: وقّع بالنشر. وإلا: تراجَع لتوقيع debug (لا نُفشل
          # البناء كلّه بسبب سرّ خاطئ) مع تحذير واضح لتصحيح السرّ لاحقًا.
          if keytool -list -keystore android/app/health-release.jks \
              -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            {
              echo "storeFile=health-release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "✅ سيُوقَّع الإصدار بمفتاح النشر الثابت."
          else
            echo "::warning::KEYSTORE_BASE64/STORE_PASSWORD غير صالح — بناء بتوقيع debug مؤقّتًا. صحّح قيمة السرّ لتثبيت التوقيع."
            rm -f android/app/health-release.jks android/key.properties
          fi

      - run: flutter pub get

      # توليد أيقونات المُطلِق من assets/icon قبل البناء (adaptive + legacy).
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build split-per-abi (release)
        run: |
          # رقم البناء = 1000 + رقم التشغيل: متصاعد دائمًا وأعلى من أي نسخة سابقة
          # (كي تُثبَّت التحديثات فوق القديم دون رفض «تنزيل إصدار أقدم»).
          BN=$((1000 + ${{ github.run_number }}))
          flutter build apk --release --split-per-abi \
            --build-name=1.2.${{ github.run_number }} \
            --build-number=$BN

      - name: Prepare release assets
        run: |
          mkdir -p out
          APKDIR=build/app/outputs/flutter-apk
          cp "$APKDIR/app-arm64-v8a-release.apk" out/HealthReminder.apk
          cp "$APKDIR/app-armeabi-v7a-release.apk" out/HealthReminder-armeabi-v7a.apk || true
          cat > out/version.json <<EOF
          {
            "version": "1.2.${{ github.run_number }}",
            "build": ${{ github.run_number }},
            "url": "https://github.com/alaoufi/health_reminder/releases/download/latest/HealthReminder.apk"
          }
          EOF
          echo "version.json:"; cat out/version.json

      - name: Publish to 'latest' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          prerelease: false
          files: |
            out/HealthReminder.apk
            out/HealthReminder-armeabi-v7a.apk
            out/version.json
