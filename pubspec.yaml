name: health_reminder
description: "لا تجلس طويلًا — مذكّر صحّي بكسر الجلوس والحركة"
publish_to: 'none'
# رقم الإصدار يُضبط تلقائيًّا في CI إلى 1.2.<run_number>؛ هذا الأساس للبناء المحليّ.
version: 1.2.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # تخزين الإعداد محليًّا
  shared_preferences: ^2.3.2
  # إشعارات محلية (تنبيه صامت بملء الشاشة عند حلول الفترة)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  # نافذة نظام فوق كل التطبيقات (قفل الحركة فوق أي تطبيق)
  flutter_overlay_window: ^0.5.0
  # التحديث الذاتيّ عبر GitHub Releases
  http: ^1.2.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# أيقونة الإطلاق (شعار التطبيق): شخصية حركة بيضاء على تدرّج أخضر.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
